# relBE MGE pipeline -- system paths
# Mirrors the 6-key layout of ~/Documents/GitHub/phagpipe/configs/system_paths.yaml
#
# Defaults target Pooja's arm64 macOS laptop. Do NOT edit this file for your
# machine: copy configs/system_paths_local.yaml.example to
# configs/system_paths_local.yaml and edit that -- the loader prefers it.
#
# An empty string means "capability absent"; the dependent process self-disables
# rather than failing the run.

reference_data:
  relbe_seed:       "anchors/relBE_seed.fa"
  relbe_core:       "anchors/relBE_core.fa"      # Stage 2 OUTPUT; absent until built
  vehicle_ends:     "assets/vehicle_ends.fa"
  country_region:   "assets/country_region_m49.tsv"

data_storage:
  public_16_gbk:    "data/public_16/gbk"
  public_16_fasta:  "data/public_16/fasta"
  tadb3_gbk:        "data/tadb3/genomes/gbk"
  tadb3_fasta:      "data/tadb3/genomes/fasta"
  genomes_sweep:    "data/ncbi_sweep"
  loci_out:         "loci"
  results_out:      "results"

external_tools:
  # BLAST+ 2.17.0 arm64 NATIVE, deliberately NOT on PATH. The single most
  # important entry: brew's BLAST would be x86_64/Rosetta and a downgrade.
  blast_bin:        "/Users/pooja/opt/ncbi-blast-2.17.0+/bin"
  java_home:        "/Users/pooja/opt/jdk-17.0.21+9/Contents/Home"   # arm64 NATIVE (x86_64 JDK leaks its arch to tasks)
  python_exec:      "/usr/bin/python3"
  rscript:          "/usr/local/bin/Rscript"

databases:
  isfinder_fa:      "db/isfinder/IS.fna"
  isfinder_db:      "db/isfinder/ISfinder"
  plasmidfinder_fa: "db/plasmidfinder/plasmidfinder.fa"
  plasmidfinder_scope: "assets/plasmidfinder_taxon_scope.tsv"
  refseq_entero_db: ""                            # empty => paralogy check skipped

temp_dirs:
  # NOT /tmp. macOS prunes it -- that pruning is what destroyed the provenance
  # of blastdb/all16 and blastdb/tadb3_loci.
  temp_root:        "tmp"
  work_dir:         "work"

system:
  default_permissions: "664"
  max_cpus:         8
  max_memory:       "16.GB"
